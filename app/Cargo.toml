[package]
name = "mycals-app"
version.workspace = true
edition.workspace = true

[dependencies]
dioxus = { version = "0.7.10" }
dioxus-router = "0.7.10"
mycals-common = { path = "../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.8", default-features = false, features = ["http", "json"] }
base64 = "0.22"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location", "RequestCredentials"] }
