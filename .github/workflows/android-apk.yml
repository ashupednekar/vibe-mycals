name: Android APK

# Builds a sideloadable APK with Expo Prebuild + Gradle, then publishes it to
# the `mobile-latest` GitHub release so the landing page can link to it.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Expo prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Gradle assemble release
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk mycals.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: Vibe MyCals mobile build
          files: mycals.apk
          make_latest: true
