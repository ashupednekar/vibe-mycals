name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Shared logic tests
        run: cargo test -p mycals-common
      - name: Clippy (wasm)
        run: cargo clippy -p vibe-mycals-api -p vibe-mycals-app --target wasm32-unknown-unknown -- -D warnings
      - name: Install workers-rs build tool
        run: cargo install worker-build --version 0.9.0 --locked
      - name: Build Worker
        run: cd api/cmd/worker && worker-build --release

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10
      - name: Build Dioxus app
        run: cd app && dx build --platform web --release
