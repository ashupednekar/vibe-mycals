name: Mobile (Expo / EAS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, all]
        default: all
      submit:
        description: Submit to the stores after building
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Decide platform
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.platform }}" = "all" ] || [ "${{ inputs.platform }}" = "${{ matrix.platform }}" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install EAS CLI
        if: steps.gate.outputs.go == 'true'
        run: npm install -g eas-cli
      - name: EAS build
        if: steps.gate.outputs.go == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.APP_URL || 'https://mycals.ashupednekar49.workers.dev' }}
        run: |
          PROFILE="${{ github.ref_type == 'tag' && 'production' || 'preview' }}"
          SUBMIT="${{ inputs.submit && '--auto-submit' || '' }}"
          eas build --platform "${{ matrix.platform }}" --profile "$PROFILE" --non-interactive $SUBMIT
